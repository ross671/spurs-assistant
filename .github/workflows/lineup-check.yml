# .github/workflows/lineup-check.yml
# ------------------------------------
# Checks for a Spurs lineup every 10 minutes between 11:00–23:00 UTC.
# On non-matchdays the script detects there's no game and exits silently.
# On matchdays it fires the Telegram alert the moment the lineup is published.
# seen_lineups.json ensures the alert is sent exactly once per match.

name: Lineup Check

on:
  schedule:
    # Every 10 minutes, between 11:00 and 23:00 UTC
    # This covers all Premier League (12:30–20:00) and European (17:45–20:00) kickoffs
    - cron: "*/10 11-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lineup check
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python spurs_assistant.py lineup

      - name: Save seen records
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_lineups.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update seen lineups [skip ci]"
          git push
